<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Center Badge -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#badgeGrad)" stroke="#a855f7" stroke-width="4" stroke-opacity="0.4" />

  <!-- Monogram / Code Glyphs < / > -->
  <g stroke="url(#codeGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left Angle Bracket -->
    <path d="M 210 190 L 155 256 L 210 322" />
    <!-- Center Slash -->
    <path d="M 276 170 L 236 342" />
    <!-- Right Angle Bracket -->
    <path d="M 302 190 L 357 256 L 302 322" />
  </g>
</svg>
